services:
  postgres:
    image: postgres:16
    container_name: showbar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: showbarmanager
      POSTGRES_USER: showbar
      POSTGRES_PASSWORD: showbar123
    ports:
      - "5432:5432"
    volumes:
      - showbar_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: showbar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: showbar_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: showbar
      MINIO_ROOT_PASSWORD: showbar123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - showbar_minio_data:/data

volumes:
  showbar_postgres_data:
  showbar_minio_data: