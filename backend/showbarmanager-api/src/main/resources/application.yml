server:
  port: 8080

spring:
  application:
    name: showbarmanager-api

  datasource:
    url: jdbc:postgresql://localhost:5432/showbarmanager
    username: showbar
    password: showbar123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: "showbarmanager-local-development-secret-key-very-secure-2026"
      expiration: 86400000